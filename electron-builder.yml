appId: com.josh.advdiploma
productName: Advanced Diploma PT
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
mac:
  # universal = one binary for both Intel and Apple Silicon MacBooks
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.education
win:
  target:
    - dir
